name: Windows

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # what packaging/windows/installer.ps1 installs
          cache: pip
          cache-dependency-path: .github/workflows/windows.yml

      - name: Check Python and Tk
        run: |
          python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Output "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Output "OK  $($_.FullName)" }
          }
          if ($bad) { exit 1 }

      - name: Install host-side dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile soxr sounddevice librosa websockets httpx fastapi "uvicorn[standard]" pydantic pyyaml python-dotenv
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio

      - name: Installer diagnostic (informational)
        continue-on-error: true   # no Docker/WSL/GPU on CI runners
        shell: pwsh
        run: '& ./packaging/windows/installer.ps1 -Diagnostic'

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\src
          PYTHONUTF8: "1"
        run: python -m pytest dev/tests -q -p no:cacheprovider -ra --junitxml=junit.xml

      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          lines = []
          for tc in ET.parse('junit.xml').iter('testcase'):
              for tag in ('failure', 'error'):
                  el = tc.find(tag)
                  if el is None:
                      continue
                  name = f"{tc.get('classname')}::{tc.get('name')}"
                  msg = (el.get('message') or '').strip().splitlines()
                  body = (el.text or '').strip().splitlines()
                  tail = ' | '.join(l.strip() for l in body[-6:])
                  lines.append(f"{tag.upper()} {name}\n  {msg[0][:300] if msg else ''}\n  {tail[:700]}")
          print(f"{len(lines)} failing tests")
          chunk = []
          for i, l in enumerate(lines):
              chunk.append(l)
              if len(chunk) == 8 or i == len(lines) - 1:
                  print(f"::error title=macOS test failures ({i + 1}/{len(lines)})::" + esc('\n'.join(chunk)))
                  chunk = []
          PY
