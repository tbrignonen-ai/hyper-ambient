name: macOS

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/macos/requirements-macos.txt

      - name: Check architecture
        run: |
          uname -m
          python -c "import platform, sys; print(platform.machine(), sys.version)"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install macOS requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/macos/requirements-macos.txt
          pip install pytest pytest-asyncio

      - name: Import smoke (MLX / Metal)
        continue-on-error: true   # CI VMs may not expose Metal; informational
        run: python -c "import mlx.core as mx; print(mx.default_device(), mx.array([1,2,3]).sum())"

      - name: Launcher is executable
        run: test -x packaging/macos/lancer.command || (ls -l packaging/macos/lancer.command; exit 1)

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest dev/tests -q -p no:cacheprovider -ra --junitxml=junit.xml

      - name: Report failures as annotations
        if: failure() && hashFiles('junit.xml') != ''
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          lines = []
          for tc in ET.parse('junit.xml').iter('testcase'):
              for tag in ('failure', 'error'):
                  el = tc.find(tag)
                  if el is None:
                      continue
                  name = f"{tc.get('classname')}::{tc.get('name')}"
                  msg = (el.get('message') or '').strip().splitlines()
                  body = (el.text or '').strip().splitlines()
                  tail = ' | '.join(l.strip() for l in body[-6:])
                  lines.append(f"{tag.upper()} {name}\n  {msg[0][:300] if msg else ''}\n  {tail[:700]}")
          print(f"{len(lines)} failing tests")
          chunk = []
          for i, l in enumerate(lines):
              chunk.append(l)
              if len(chunk) == 8 or i == len(lines) - 1:
                  print(f"::error title=Test failures ({i + 1}/{len(lines)})::" + esc('\n'.join(chunk)))
                  chunk = []
          PY
