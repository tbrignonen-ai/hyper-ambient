name: macOS

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/macos/requirements-macos.txt

      - name: Check architecture
        run: |
          uname -m
          python -c "import platform, sys; print(platform.machine(), sys.version)"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install macOS requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/macos/requirements-macos.txt
          pip install pytest pytest-asyncio

      - name: Import smoke (MLX / Metal)
        continue-on-error: true   # CI VMs may not expose Metal; informational
        run: python -c "import mlx.core as mx; print(mx.default_device(), mx.array([1,2,3]).sum())"

      - name: Launcher is executable
        run: test -x packaging/macos/lancer.command || (ls -l packaging/macos/lancer.command; exit 1)

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest dev/tests -q -p no:cacheprovider -ra
